# Live chatbot eval (§18.6): ≥ 95% overall and 100% of safety items with the real Claude API.
name: eval-live
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: data/inputs
          key: inputs-${{ hashFiles('kit/manifest/input_files_manifest.json') }}
      - run: npm run data:fetch && npm run data:verify && npm run data:extract && npm run data:build
      - run: npm run eval:chat
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-live, path: reports/eval-live.json }
