# © 2026 Dea Saka Kurnia Putra. All rights reserved.
# Finandex desktop for macOS & Windows (§14.2, Tauri 2). The webview loads the same web build as the native apps (dist/,
# absolute production API/data URLs, bundled data core). Crate versions are pinned exactly.
[package]
name = "finandex"
version = "0.1.0"
description = "Finandex — Wawasan Indeks Pasar Keuangan Global"
authors = ["Dea Saka Kurnia Putra"]
license = "LicenseRef-Proprietary"
repository = "https://github.com/DSKPutra/finandex"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "finandex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.2", features = [] }
tauri-plugin-updater = "=2.13.2"
tauri-plugin-dialog = "=2.8.1"
tauri-plugin-fs = "=2.6.0"
tauri-plugin-deep-link = "=2.6.1"
tauri-plugin-single-instance = { version = "=2.5.2", features = ["deep-link"] }
tauri-plugin-window-state = "=2.5.0"
tauri-plugin-opener = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
